[package]
name = "oldclient-v1_0_2"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "oldclient"
path = "../client/main.rs"

[dependencies]
iroh-relay = { version = "=1.0.2", default-features = false, features = ["tls-ring"] }
iroh-base = { version = "=1.0.2", default-features = false }
iroh-dns = "=1.0.2"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
