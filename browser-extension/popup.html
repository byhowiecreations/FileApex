<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FileApex</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 12px;
      width: 260px;
      background: #111827;
      color: #f9fafb;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    select, button {
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 12px;
      padding: 8px 10px;
    }
    select {
      background: #1f2937;
      color: #f9fafb;
      border: 1px solid #374151;
      margin-bottom: 10px;
    }
    .port-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
    }
    .port-row input {
      width: 90px;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 12px;
      padding: 6px 8px;
      background: #1f2937;
      color: #f9fafb;
      border: 1px solid #374151;
    }
    .port-row button {
      width: auto;
      padding: 6px 10px;
      text-align: center;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    button {
      border: 1px solid #374151;
      background: #1f2937;
      color: #f9fafb;
      text-align: left;
      cursor: pointer;
    }
    button.primary {
      background: #0f766e;
      border-color: #0d9488;
      font-weight: 600;
    }
    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      min-height: 16px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <h1>FileApex</h1>
  <label for="device">Target device</label>
  <select id="device"></select>
  <div class="actions">
    <button id="postBulletin" class="primary">Post to Bulletin Board</button>
    <button id="openOnDevice">Open on device</button>
    <button id="copyToDevice">Copy link to clipboard</button>
  </div>
  <div class="port-row">
    <label for="serverPort" style="margin:0;">Port</label>
    <input id="serverPort" type="number" min="1" max="65535" value="8080" />
    <button id="savePort" type="button">Save</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
