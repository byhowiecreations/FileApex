# Tracked, secret-free Gradle settings shared by every build host and by F-Droid.
# Private values (Google/Firebase IDs and secrets, backup dir, Inno threads) live in
# ~/.gradle/gradle.properties; see gradle.user.properties.example.
# verifyNoSecretsInTrackedProperties fails the build if a secret-like key or value is added here.
# App version is committed in version.md (name= / code=); do not put it here.

org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.r8.optimizedShrinking=true
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
org.jetbrains.compose.experimental.jscanvas.enabled=false

# JDK 21 for Gradle (gradlew picks fileapex.java.home.<platform> when JAVA_HOME is unset).
# Do not set org.gradle.java.home: it is a single global value and breaks cross-platform builds.
# A host can override in ~/.gradle/gradle.properties without touching the repo.
fileapex.java.home.macos=.build-jdk/jdk-21.0.11+10/Contents/Home
fileapex.java.home.windows=C:/Program Files/Java/jdk-21
